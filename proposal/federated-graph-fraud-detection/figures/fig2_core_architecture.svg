<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="RQ 1 core architecture: a server on top averages the structure encoder exchanged with three institutions below; each institution encodes its typed-relation graph with a relation-typed structure encoder and its node features with a local feature encoder, fuses them, trains with a self-learning loss plus a supervised loss on few labels, and scores anomalies; an edge-inference attack measures leakage on what is shared.">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
    <style>
      .def  { fill: #e3eefa; stroke: #1f5fa8; stroke-width: 1.8; }
      .det  { fill: #ececec; stroke: #555;    stroke-width: 1.8; }
      .io   { fill: #fff;    stroke: #111;    stroke-width: 1.6; }
      .held { fill: #fbe9e7; stroke: #b3261e; stroke-width: 1.8; stroke-dasharray: 5 3; }
      .bnd  { fill: #fcfcfc; stroke: #888; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .fwd  { stroke: #111; stroke-width: 1.6; fill: none; marker-end: url(#aK); }
      .two  { stroke: #1f5fa8; stroke-width: 1.8; fill: none; marker-start: url(#aK); marker-end: url(#aK); }
      .atk  { stroke: #b3261e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#aR); }
      .shr  { stroke: #1f5fa8; stroke-width: 1.8; fill: none; marker-end: url(#aK); }
      .bus  { stroke: #111; stroke-width: 1.6; fill: none; }
      .col  { font-size: 15px; font-weight: bold; }
      .t    { font-size: 12px; text-anchor: middle; }
      .tb   { font-size: 13px; text-anchor: middle; font-weight: bold; }
      .ts   { font-size: 11px; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- server -->
  <rect class="def" x="345" y="30" width="310" height="70" rx="4"/>
  <text class="tb" x="500" y="58">Server</text><text class="ts" x="500" y="78">averages the structure encoder</text>
  <path class="atk" d="M655,65 H696"/>
  <rect class="held" x="700" y="30" width="280" height="70" rx="4"/>
  <text class="tb" x="840" y="58">Edge-inference attack</text><text class="ts" x="840" y="78">leakage measured on what is shared</text>

  <!-- exchange bus -->
  <path d="M155,135 H805" stroke="#1f5fa8" stroke-width="1.8" fill="none"/>
  <path class="two" d="M500,135 V102"/>
  <text class="ts" x="330" y="127">structure encoder: parameters up, global model down</text>

  <!-- institution 1 -->
  <rect class="bnd" x="20" y="170" width="310" height="312" rx="6"/>
  <text class="col" x="32" y="192">Institution 1</text>
  <rect class="io" x="32" y="210" width="110" height="44" rx="4"/>
  <text class="tb" x="87" y="228" style="font-size:12px">Typed-relation</text><text class="tb" x="87" y="244" style="font-size:12px">graph</text>
  <rect class="io" x="202" y="210" width="116" height="44" rx="4"/>
  <text class="tb" x="260" y="237" style="font-size:12px">Node features</text>
  <path class="fwd" d="M87,254 V272"/>
  <path class="fwd" d="M260,254 V272"/>
  <rect class="def" x="32" y="274" width="136" height="50" rx="4"/>
  <text class="tb" x="100" y="296" style="font-size:12px">Structure encoder</text><text class="ts" x="100" y="313">relation-typed</text>
  <rect class="det" x="182" y="274" width="136" height="50" rx="4"/>
  <text class="tb" x="250" y="296" style="font-size:12px">Feature encoder</text><text class="ts" x="250" y="313">local only</text>
  <path class="fwd" d="M100,324 V342"/>
  <path class="fwd" d="M250,324 V342"/>
  <rect class="io" x="80" y="344" width="190" height="40" rx="4"/>
  <text class="tb" x="175" y="369" style="font-size:12px">Fuse: node embeddings</text>
  <path class="bus" d="M175,384 V398"/>
  <path class="fwd" d="M175,398 H103 V408"/>
  <path class="fwd" d="M175,398 H252 V408"/>
  <rect class="io" x="32" y="410" width="143" height="58" rx="4"/>
  <text class="tb" x="103" y="429" style="font-size:12px">Training loss</text><text class="ts" x="103" y="444">self-learning terms</text><text class="ts" x="103" y="458">+ supervised, few labels</text>
  <rect class="io" x="187" y="410" width="131" height="58" rx="4"/>
  <text class="tb" x="252" y="435" style="font-size:12px">Anomaly score</text><text class="ts" x="252" y="453">validation threshold</text>
  <path class="shr" d="M155,274 V135" style="marker-end:none;marker-start:url(#aK)"/>

  <!-- institution 2 -->
  <rect class="bnd" x="345" y="170" width="310" height="312" rx="6"/>
  <text class="col" x="357" y="192">Institution 2</text>
  <rect class="io" x="357" y="210" width="110" height="44" rx="4"/>
  <text class="tb" x="412" y="228" style="font-size:12px">Typed-relation</text><text class="tb" x="412" y="244" style="font-size:12px">graph</text>
  <rect class="io" x="527" y="210" width="116" height="44" rx="4"/>
  <text class="tb" x="585" y="237" style="font-size:12px">Node features</text>
  <path class="fwd" d="M412,254 V272"/>
  <path class="fwd" d="M585,254 V272"/>
  <rect class="def" x="357" y="274" width="136" height="50" rx="4"/>
  <text class="tb" x="425" y="296" style="font-size:12px">Structure encoder</text><text class="ts" x="425" y="313">relation-typed</text>
  <rect class="det" x="507" y="274" width="136" height="50" rx="4"/>
  <text class="tb" x="575" y="296" style="font-size:12px">Feature encoder</text><text class="ts" x="575" y="313">local only</text>
  <path class="fwd" d="M425,324 V342"/>
  <path class="fwd" d="M575,324 V342"/>
  <rect class="io" x="405" y="344" width="190" height="40" rx="4"/>
  <text class="tb" x="500" y="369" style="font-size:12px">Fuse: node embeddings</text>
  <path class="bus" d="M500,384 V398"/>
  <path class="fwd" d="M500,398 H428 V408"/>
  <path class="fwd" d="M500,398 H577 V408"/>
  <rect class="io" x="357" y="410" width="143" height="58" rx="4"/>
  <text class="tb" x="428" y="429" style="font-size:12px">Training loss</text><text class="ts" x="428" y="444">self-learning terms</text><text class="ts" x="428" y="458">+ supervised, few labels</text>
  <rect class="io" x="512" y="410" width="131" height="58" rx="4"/>
  <text class="tb" x="577" y="435" style="font-size:12px">Anomaly score</text><text class="ts" x="577" y="453">validation threshold</text>
  <path class="shr" d="M480,274 V135" style="marker-end:none;marker-start:url(#aK)"/>

  <!-- institution 3 -->
  <rect class="bnd" x="670" y="170" width="310" height="312" rx="6"/>
  <text class="col" x="682" y="192">Institution 3</text>
  <rect class="io" x="682" y="210" width="110" height="44" rx="4"/>
  <text class="tb" x="737" y="228" style="font-size:12px">Typed-relation</text><text class="tb" x="737" y="244" style="font-size:12px">graph</text>
  <rect class="io" x="852" y="210" width="116" height="44" rx="4"/>
  <text class="tb" x="910" y="237" style="font-size:12px">Node features</text>
  <path class="fwd" d="M737,254 V272"/>
  <path class="fwd" d="M910,254 V272"/>
  <rect class="def" x="682" y="274" width="136" height="50" rx="4"/>
  <text class="tb" x="750" y="296" style="font-size:12px">Structure encoder</text><text class="ts" x="750" y="313">relation-typed</text>
  <rect class="det" x="832" y="274" width="136" height="50" rx="4"/>
  <text class="tb" x="900" y="296" style="font-size:12px">Feature encoder</text><text class="ts" x="900" y="313">local only</text>
  <path class="fwd" d="M750,324 V342"/>
  <path class="fwd" d="M900,324 V342"/>
  <rect class="io" x="730" y="344" width="190" height="40" rx="4"/>
  <text class="tb" x="825" y="369" style="font-size:12px">Fuse: node embeddings</text>
  <path class="bus" d="M825,384 V398"/>
  <path class="fwd" d="M825,398 H753 V408"/>
  <path class="fwd" d="M825,398 H902 V408"/>
  <rect class="io" x="682" y="410" width="143" height="58" rx="4"/>
  <text class="tb" x="753" y="429" style="font-size:12px">Training loss</text><text class="ts" x="753" y="444">self-learning terms</text><text class="ts" x="753" y="458">+ supervised, few labels</text>
  <rect class="io" x="837" y="410" width="131" height="58" rx="4"/>
  <text class="tb" x="902" y="435" style="font-size:12px">Anomaly score</text><text class="ts" x="902" y="453">validation threshold</text>
  <path class="shr" d="M805,274 V135" style="marker-end:none;marker-start:url(#aK)"/>

  <!-- legend -->
  <g transform="translate(20,506)" font-size="12">
    <rect class="def" x="0" y="-9" width="22" height="14" rx="2"/><text x="30" y="3" style="font-size:12px">shared with server</text>
    <rect class="det" x="190" y="-9" width="22" height="14" rx="2"/><text x="220" y="3" style="font-size:12px">stays local</text>
    <rect class="held" x="340" y="-9" width="22" height="14" rx="2"/><text x="370" y="3" style="font-size:12px">leakage measurement</text>
    <rect x="540" y="-9" width="22" height="14" rx="2" fill="#fcfcfc" stroke="#888" stroke-dasharray="4 3"/><text x="570" y="3" style="font-size:12px">institution (graph, features, labels stay inside)</text>
  </g>
</svg>
