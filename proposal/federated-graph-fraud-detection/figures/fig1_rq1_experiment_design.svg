<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="RQ 1 experiment design: one transaction graph is partitioned into institutions by Louvain, Dirichlet and LDA splits at K = 10, 15 and 20; sharing and edge-evaluator ablations are compared with FedGAD, FedStar, FedATH and a centralised GNN; outputs are PR-AUC, recall at fixed precision, F1, variance across partition seeds and results by client count.">
  <defs>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <style>
      .def  { fill: #e3eefa; stroke: #1f5fa8; stroke-width: 1.6; }
      .det  { fill: #ececec; stroke: #555;    stroke-width: 1.8; }
      .io   { fill: #fff;    stroke: #111;    stroke-width: 1.6; }
      .panel{ fill: #fff; stroke: #cfcfcf; }
      .fwd  { stroke: #111; stroke-width: 1.6; fill: none; marker-end: url(#aK); }
      .bus  { stroke: #111; stroke-width: 1.6; fill: none; }
      .col  { font-size: 15px; font-weight: bold; }
      .t    { font-size: 12px; text-anchor: middle; }
      .tb   { font-size: 13px; text-anchor: middle; font-weight: bold; }
      .ts   { font-size: 11px; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <text class="col" x="20" y="28">1  Partition</text>
  <text class="col" x="350" y="28">2  Train and compare</text>
  <text class="col" x="710" y="28">3  Report</text>

  <!-- ===== column 1 ===== -->
  <rect class="io" x="20" y="50" width="280" height="44" rx="4"/>
  <text class="tb" x="160" y="77">One transaction graph</text>
  <path class="fwd" d="M160,94 V112"/>

  <rect class="panel" x="20" y="114" width="280" height="140" rx="5"/>
  <text class="tb" x="160" y="136">Non-IID partition protocol</text>
  <rect class="def" x="30" y="148" width="260" height="28" rx="3"/><text class="t" x="160" y="166">Louvain split</text>
  <rect class="def" x="30" y="182" width="260" height="28" rx="3"/><text class="t" x="160" y="200">Dirichlet split (β = 0.2)</text>
  <rect class="def" x="30" y="216" width="260" height="28" rx="3"/><text class="t" x="160" y="234">LDA split</text>
  <path class="fwd" d="M160,254 V272"/>

  <rect class="panel" x="20" y="274" width="280" height="80" rx="5"/>
  <text class="tb" x="160" y="296">Number of institutions K</text>
  <rect class="def" x="30"  y="308" width="80" height="30" rx="3"/><text class="t" x="70"  y="327">K = 10</text>
  <rect class="def" x="120" y="308" width="80" height="30" rx="3"/><text class="t" x="160" y="327">K = 15</text>
  <rect class="def" x="210" y="308" width="80" height="30" rx="3"/><text class="t" x="250" y="327">K = 20</text>
  <text class="ts" x="160" y="378">non-IID by size, customers, fraud-type mix</text>

  <path class="fwd" d="M300,190 H346"/>

  <!-- ===== column 2 ===== -->
  <rect class="panel" x="350" y="50" width="320" height="80" rx="5"/>
  <text class="tb" x="510" y="72">What is shared with the server</text>
  <rect class="def" x="360" y="86" width="90"  height="32" rx="3"/><text class="t" x="405" y="106">Nothing</text>
  <rect class="def" x="456" y="86" width="100" height="32" rx="3"/><text class="t" x="506" y="106">All parameters</text>
  <rect class="def" x="562" y="86" width="98"  height="32" rx="3"/><text class="t" x="611" y="106">Structure encoder</text>

  <rect class="panel" x="350" y="142" width="320" height="80" rx="5"/>
  <text class="tb" x="510" y="164">Edge evaluator</text>
  <rect class="def" x="360" y="178" width="90"  height="32" rx="3"/><text class="t" x="405" y="198">None</text>
  <rect class="def" x="456" y="178" width="100" height="32" rx="3"/><text class="t" x="506" y="198">Shared</text>
  <rect class="def" x="562" y="178" width="98"  height="32" rx="3"/><text class="t" x="611" y="198">Private (local)</text>

  <rect class="panel" x="350" y="234" width="320" height="110" rx="5"/>
  <text class="tb" x="510" y="256">Baselines, same partitions</text>
  <rect class="det" x="360" y="266" width="96" height="30" rx="3"/><text class="t" x="408" y="285">FedGAD</text>
  <rect class="det" x="462" y="266" width="96" height="30" rx="3"/><text class="t" x="510" y="285">FedStar</text>
  <rect class="det" x="564" y="266" width="96" height="30" rx="3"/><text class="t" x="612" y="285">FedATH</text>
  <rect class="det" x="360" y="302" width="300" height="30" rx="3"/><text class="t" x="510" y="321">Centralised GNN (upper bound)</text>
  <path class="fwd" d="M510,344 V362"/>

  <rect class="io" x="350" y="364" width="320" height="50" rx="4"/>
  <text class="tb" x="510" y="386">Train and evaluate</text>
  <text class="ts" x="510" y="404">every arm × every partition</text>

  <!-- bus to outputs -->
  <path class="bus" d="M670,389 H690 V72"/>
  <path class="fwd" d="M690,72 H706"/>
  <path class="fwd" d="M690,128 H706"/>
  <path class="fwd" d="M690,184 H706"/>
  <path class="fwd" d="M690,240 H706"/>
  <path class="fwd" d="M690,296 H706"/>

  <!-- ===== column 3 ===== -->
  <rect class="io" x="710" y="50"  width="270" height="44" rx="4"/><text class="tb" x="845" y="77">PR-AUC</text>
  <rect class="io" x="710" y="106" width="270" height="44" rx="4"/><text class="tb" x="845" y="133">Recall at fixed precision</text>
  <rect class="io" x="710" y="162" width="270" height="44" rx="4"/><text class="tb" x="845" y="189">F1 (summary)</text>
  <rect class="io" x="710" y="218" width="270" height="44" rx="4"/><text class="tb" x="845" y="245">Variance across partition seeds</text>
  <rect class="io" x="710" y="274" width="270" height="44" rx="4"/><text class="tb" x="845" y="301">Results by client count K</text>

  <g transform="translate(20,448)">
    <rect class="def" x="0" y="-9" width="22" height="14" rx="2"/><text x="30" y="3" style="font-size:12px">varied factor</text>
    <rect class="det" x="170" y="-9" width="22" height="14" rx="2"/><text x="200" y="3" style="font-size:12px">baseline</text>
    <rect class="io" x="320" y="-9" width="22" height="14" rx="2"/><text x="350" y="3" style="font-size:12px">output</text>
  </g>
</svg>
